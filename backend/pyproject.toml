[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lynveris"
version = "0.1.0"
description = "URL inspection for families; no automatic browsing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "tldextract>=5.1,<6", "idna>=3.10,<4",
  "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.6,<1.8", "joblib>=1.4,<2", "numpy>=1.26,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]
[project.scripts]
lynveris-data = "lynveris.ml.data:main"
lynveris-train = "lynveris.ml.train:main"
lynveris-evaluate = "lynveris.ml.evaluate:main"
[tool.setuptools.packages.find]
include = ["lynveris*"]
[tool.setuptools.package-data]
lynveris = ["data/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
