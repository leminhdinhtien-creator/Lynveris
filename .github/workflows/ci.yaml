name: Product checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lynveris
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: lynveris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lynveris -d lynveris"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: pytest backend/tests -q
      - name: Migrate PostgreSQL and verify API
        env:
          LYNVERIS_DATABASE_URL: postgresql+psycopg://lynveris:ci-password@127.0.0.1:5432/lynveris
          LYNVERIS_AUTO_CREATE_DEV_DATABASE: 'false'
        run: |
          alembic -c backend/alembic.ini upgrade head
          python scripts/smoke_database.py
      - name: Build and check Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait api
          curl --fail http://127.0.0.1:8000/ready
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build web --no-web-resources-cdn --dart-define=API_BASE_URL=https://api.example.invalid
      - uses: actions/upload-artifact@v7
        with:
          name: lynveris-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
