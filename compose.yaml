services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lynveris
      POSTGRES_USER: lynveris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynveris -d lynveris"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: ./backend
    env_file: .env
    environment:
      LYNVERIS_DATABASE_URL: postgresql+psycopg://lynveris:${POSTGRES_PASSWORD}@db:5432/lynveris
      LYNVERIS_AUTO_CREATE_DEV_DATABASE: "false"
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    environment:
      LYNVERIS_DATABASE_URL: postgresql+psycopg://lynveris:${POSTGRES_PASSWORD}@db:5432/lynveris
      LYNVERIS_AUTO_CREATE_DEV_DATABASE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  pgdata:
